# Publishing with provenance, which n8n requires for a verified community node
# since 1 May 2026: the package has to be published by a workflow so npm can
# attest that the tarball was built from this source. A `npm publish` from a
# laptop produces a package that cannot be verified, whatever else is right
# about it.
#
# No NPM_TOKEN. This uses npm's trusted publishing, where the package is
# configured to trust this repository and this workflow file, and the identity
# comes from the OIDC token GitHub mints for the run. A stored token would be a
# long-lived publishing credential sitting in repository secrets, readable by
# anyone who can add a workflow; this way there is nothing to steal.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for both the identity and the provenance
  # attestation. Without it the publish fails outright under trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two things trusted publishing needs and the defaults do not give.
      #
      # No registry-url on setup-node: it writes an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, and with no token set that becomes a
      # literal placeholder which npm sends instead of using the OIDC
      # identity. The publish then answers 404, which reads like a missing
      # package rather than a refused credential.
      #
      # And a current npm: OIDC publishing landed in 11.5.1, while the npm
      # shipped with Node 22 is older than that.
      - run: npm install -g npm@latest

      # --ignore-scripts because n8n-workflow drags in isolated-vm, which
      # compiles C++ and fails to build on the runner. We need n8n-workflow
      # for its type declarations only, and this package has no native code
      # and no runtime dependencies at all, so nothing that matters is skipped.
      - run: npm ci --ignore-scripts

      # Both gates before anything leaves the machine. A community node that
      # does not compile is worse than one that does not exist: it installs,
      # and then breaks somebody's workflow at runtime.
      - run: npm run typecheck

      - run: npm run build

      - run: npm publish --provenance --access public
