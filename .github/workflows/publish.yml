# Publishing with provenance, which n8n requires for a verified community node
# since 1 May 2026: the package has to be published by a workflow so npm can
# attest that the tarball was built from this source. A `npm publish` from a
# laptop produces a package that cannot be verified, whatever else is right
# about it.
#
# No NPM_TOKEN. This uses npm's trusted publishing, where the package is
# configured to trust this repository and this workflow file, and the identity
# comes from the OIDC token GitHub mints for the run. A stored token would be a
# long-lived publishing credential sitting in repository secrets, readable by
# anyone who can add a workflow; this way there is nothing to steal.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for both the identity and the provenance
  # attestation. Without it the publish fails outright under trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Both gates before anything leaves the machine. A community node that
      # does not compile is worse than one that does not exist: it installs,
      # and then breaks somebody's workflow at runtime.
      - run: npm run typecheck

      - run: npm run build

      - run: npm publish --provenance --access public
